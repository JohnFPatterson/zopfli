[package]
name = "zopflipng-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "C ABI for the Rust ZopfliPNG optimizer (libzopflipng.a)"
repository = "https://github.com/JohnFPatterson/zopfli"

[lib]
crate-type = ["staticlib"]
name = "zopflipng"

[dependencies]
libc = "0.2"
zopflipng = { path = "../zopflipng" }
