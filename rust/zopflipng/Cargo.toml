[package]
name = "zopflipng"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PNG optimizer using Zopfli deflate (Rust port of Google ZopfliPNG)"
repository = "https://github.com/JohnFPatterson/zopfli"
readme = "README.md"

[dependencies]
crc32fast = "1"
flate2 = "1"
png = "0.17"
zopfli = { version = "0.8", default-features = false, features = ["std", "zlib"] }
