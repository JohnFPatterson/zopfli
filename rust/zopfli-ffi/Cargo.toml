[package]
name = "zopfli-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "C ABI static library (libzopfli) compatible with src/zopfli/zopfli.h"

[lib]
crate-type = ["staticlib"]
name = "zopfli"

[dependencies]
libc = "0.2"
zopfli-core = { path = "../zopfli-core" }
