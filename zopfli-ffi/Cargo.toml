[package]
name = "zopfli-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI shim for zopfli-core matching src/zopfli/zopfli.h"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "zopfli_ffi"

[dependencies]
zopfli-core = { path = "../zopfli-core" }
libc = "0.2"
